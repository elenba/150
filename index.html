<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Invited! | 150 Birthday Celebration</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --card-bg: #FFFFFF;
      --text-main: #1F2421;
      --text-muted: #5C6460;
      --accent: #C85A32;
      --accent-hover: #A84623;
      --border: #E8E2D5;
      --gold-glow: rgba(200, 90, 50, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      background-color: #FAF6F0;
    }

    /* LANGUAGE SWITCHER BAR */
    .lang-bar {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 10;
      display: flex;
      gap: 0.3rem;
      background: rgba(0, 0, 0, 0.5);
      padding: 0.35rem 0.6rem;
      border-radius: 50px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--accent);
      box-shadow: 0 2px 8px rgba(200, 90, 50, 0.4);
    }

    .lang-btn:hover:not(.active) {
      background: rgba(255, 255, 255, 0.2);
    }

    /* HERO SECTION WITH BACKGROUND IMAGE */
    .hero-banner {
      position: relative;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center top;
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 5rem 1.5rem 6rem;
      text-align: center;
      color: #FFFFFF;
    }

    .hero-banner::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(15,20,18,0.4) 0%, rgba(15,20,18,0.2) 50%, rgba(31,36,33,0.92) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 760px;
      width: 100%;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 0.8rem;
      font-weight: 700;
      color: #FFD29D;
      margin-bottom: 0.8rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 6.5vw, 4.2rem);
      line-height: 1.15;
      margin-bottom: 1.2rem;
      color: #FFFFFF;
      text-shadow: 0 3px 12px rgba(0,0,0,0.6);
    }

    .subtitle {
      font-size: 1.15rem;
      color: #F4F0EA;
      max-width: 580px;
      margin: 0 auto 2.5rem;
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
      font-weight: 400;
    }

    .btn-rsvp {
      display: inline-block;
      background-color: var(--accent);
      color: #FFFFFF;
      text-decoration: none;
      padding: 0.9rem 2.4rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 6px 20px rgba(200, 90, 50, 0.4);
      transition: all 0.2s ease;
      border: none;
    }

    .btn-rsvp:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(200, 90, 50, 0.5);
    }

    /* COUNTDOWN TIMER */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 2.5rem 0 1rem;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      padding: 0.85rem 1.2rem;
      min-width: 80px;
      text-align: center;
      color: var(--text-main);
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .time-box span {
      display: block;
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .time-box small {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* MAIN BODY CONTENT */
    .main-body {
      background-color: #FAF6F0;
      padding: 4rem 1.5rem 5rem;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    /* Event Details Grid */
    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3.5rem;
    }

    .detail-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem 1.5rem;
